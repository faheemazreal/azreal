<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="35%" stop-color="#18181b" />
      <stop offset="65%" stop-color="#27272a" />
      <stop offset="85%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect width="512" height="512" rx="108" fill="#09090b" />
  <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="#27272a" stroke-width="6" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#amberGold)" stroke-width="4" opacity="0.4" />

  <!-- Holographic CD Disc -->
  <circle cx="256" cy="256" r="172" fill="url(#discGrad)" stroke="#3f3f46" stroke-width="3" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#sheen)" stroke-width="8" opacity="0.75" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4,8" />
  
  <!-- CD Spindle / Center Hole -->
  <circle cx="256" cy="256" r="60" fill="#18181b" stroke="url(#amberGold)" stroke-width="4" />
  <circle cx="256" cy="256" r="30" fill="#09090b" stroke="#3f3f46" stroke-width="3" />

  <!-- Clapperboard / Cinema Emblem Overlay in Center -->
  <polygon points="244,236 276,256 244,276" fill="url(#amberGold)" />

  <!-- Star accents -->
  <circle cx="256" cy="98" r="4" fill="#fbbf24" />
  <circle cx="256" cy="414" r="4" fill="#fbbf24" />
</svg>
